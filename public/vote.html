<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予定を塗る｜ぬりあわせ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mast-text">
      <p class="brand">ぬり<span>あわせ</span></p>
      <p class="tagline">塗って出す日程調整</p>
    </div>
    <img class="mast-logo" id="logo" alt="" hidden>
  </header>

  <p class="notice err" id="err" role="alert"></p>

  <main id="main" hidden>
    <h1 id="title"></h1>
    <p class="lead" id="range"></p>
    <p class="notice ok" id="memo"></p>
    <p class="notice warn" id="editing" hidden></p>

    <div class="card">
      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" maxlength="40" placeholder="例）山田 太郎" autocomplete="name">
      </div>
      <div class="field">
        <label for="note">備考<span style="font-weight:400;color:var(--ink-3)">（任意）</span></label>
        <textarea id="note" maxlength="500" placeholder="例）8月12日の黄色マーカーは、塾バイトのシフトが未発表のため"></textarea>
      </div>
    </div>

    <h2>予定を塗る <span class="count" id="stat"></span></h2>

    <div class="toolbar" role="group" aria-label="塗る色をえらぶ">
      <button class="tool" data-tool="1" aria-pressed="true"><span class="chip"></span>出席可能</button>
      <button class="tool" data-tool="2" aria-pressed="false"><span class="chip"></span>未定</button>
      <button class="tool" data-tool="0" aria-pressed="false"><span class="chip"></span>消す</button>
      <span class="spacer"></span>
      <button class="btn-sm" id="undo" disabled>↩ 戻す</button>
      <button class="btn-sm" id="redo" disabled>やり直す ↪</button>
    </div>

    <div class="toolbar toolbar-2" role="group" aria-label="表示をかえる">
      <button class="btn-sm" id="zoomOut" aria-label="表示をせまくする">−</button>
      <span class="zoomlabel" id="zoomLabel">×1</span>
      <button class="btn-sm" id="zoomIn" aria-label="表示をひろげる">＋</button>
      <span style="width:8px"></span>
      <button class="btn-sm" id="left" aria-label="表を左に動かす" disabled>◀</button>
      <button class="btn-sm" id="right" aria-label="表を右に動かす" disabled>▶</button>
      <span class="spacer"></span>
      <button class="btn-sm" id="clear">全部消す</button>
    </div>

    <div id="grid"></div>

    <p class="legend">
      <span><i style="background:var(--yes)"></i>出席可能</span>
      <span><i style="background:var(--maybe)"></i>未定・行けるかも</span>
      <span><i style="background:#e8ebf2"></i>参加できない</span>
    </p>
    <p class="hint" style="margin:10px 2px 0">
      色をえらんで、マス目をなぞると塗れます。塗りまちがえたら「戻す」で取り消せます。<br>
      <b>画面を上下に動かすときは、左の日付の列をなぞってください。</b>
      日付をタップするとその日をまとめて塗れます。細かく塗りたいときは ＋ で表示を広げてください。
    </p>
  </main>

  <div id="thanks" hidden>
    <div class="notice ok" style="margin-bottom:18px" id="thanksMsg"></div>
    <div class="card">
      <label>あとから修正するためのURL</label>
      <p class="hint" style="margin-top:0">このURLを開くと、いつでも塗り直せます。修正内容は主催者に通知されます。</p>
      <div class="linkbox">
        <input type="text" id="editUrl" readonly>
        <button class="btn-sm" id="copyEdit">コピー</button>
      </div>
      <p style="margin:12px 0 0"><a href="#" id="reopen">続けて修正する</a></p>
    </div>
  </div>

</div>

<div class="sticky-submit" id="bar" hidden>
  <div class="inner"><button class="btn-main" id="submit">この内容で提出する</button></div>
</div>

<script type="module">
import { $, api, qs, PaintGrid, fmtDate, fmtDow, fmtTime } from '/assets/app.js';

const pubToken = qs('e');
const editToken = qs('r');
const err = $('#err');
const fatal = (m) => { err.textContent = m; };

let ev, grid, mode;

function updateStat() {
  const y = grid.countBy('1'), m = grid.countBy('2');
  const per = ev.slot_min;
  const h = (n) => (n * per / 60).toFixed(n * per % 60 === 0 ? 0 : 2).replace(/\.00$/, '');
  $('#stat').textContent = `出席可能 ${h(y)}時間 ／ 未定 ${h(m)}時間`;
}

function syncHistoryButtons() {
  $('#undo').disabled = !grid.canUndo();
  $('#redo').disabled = !grid.canRedo();
}

function syncScrollButtons() {
  $('#left').disabled = !grid.canScrollLeft();
  $('#right').disabled = !grid.canScrollRight();
}

function buildGrid() {
  grid = new PaintGrid($('#grid'), ev, {
    onChange: updateStat,
    onHistory: syncHistoryButtons,
    onScroll: syncScrollButtons,
  });
  updateStat();
  syncHistoryButtons();

  document.querySelectorAll('.tool[data-tool]').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tool[data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      grid.setTool(b.dataset.tool);
    });
  });

  $('#undo').addEventListener('click', () => grid.undo());
  $('#redo').addEventListener('click', () => grid.redo());
  $('#left').addEventListener('click', () => grid.scrollHours(-1));
  $('#right').addEventListener('click', () => grid.scrollHours(1));

  let zoom = 1;
  const applyZoom = () => { grid.fit(zoom); $('#zoomLabel').textContent = '×' + zoom; };
  $('#zoomIn').addEventListener('click', () => { zoom = Math.min(6, zoom + 1); applyZoom(); });
  $('#zoomOut').addEventListener('click', () => { zoom = Math.max(1, zoom - 1); applyZoom(); });
  $('#clear').addEventListener('click', () => {
    if (confirm('塗った内容をすべて消します。よろしいですか？')) grid.clearAll();
  });
}

function fillHeader() {
  $('#title').textContent = ev.title;
  const d1 = ev.dates[0], d2 = ev.dates[ev.dates.length - 1];
  $('#range').textContent =
    `${fmtDate(d1)}(${fmtDow(d1)}) 〜 ${fmtDate(d2)}(${fmtDow(d2)})　${fmtTime(ev.start_min)}–${fmtTime(ev.end_min)}　${ev.slot_min}分きざみ`;
  if (ev.memo) $('#memo').textContent = ev.memo;
  if (ev.image_url) {
    const logo = $('#logo');
    logo.src = ev.image_url;
    logo.alt = ev.title;
    logo.hidden = false;
  }
}

async function boot() {
  try {
    if (editToken) {
      mode = 'edit';
      const d = await api('/api/r/' + encodeURIComponent(editToken));
      ev = d.event;
      fillHeader();
      buildGrid();
      $('#name').value = d.response.name;
      $('#note').value = d.response.note;
      grid.setData(d.response.slots);
      updateStat();
      syncHistoryButtons();
      const box = $('#editing');
      box.hidden = false;
      box.textContent = `提出済みの内容を読み込みました（${d.response.revision}回目の内容）。塗り直して「修正を保存する」を押してください。`;
      $('#submit').textContent = '修正を保存する';
    } else if (pubToken) {
      mode = 'new';
      const d = await api('/api/e/' + encodeURIComponent(pubToken));
      ev = d.event;
      fillHeader();
      buildGrid();
    } else {
      return fatal('URLが正しくありません。主催者から届いたリンクをもう一度開いてください。');
    }
    $('#main').hidden = false;
    $('#bar').hidden = false;
  } catch (e) {
    fatal(e.message);
  }
}
boot();

$('#submit').addEventListener('click', async () => {
  err.textContent = '';
  const name = $('#name').value.trim();
  if (!name) {
    err.textContent = 'お名前を入力してください。';
    $('#name').focus();
    scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const payload = { name, note: $('#note').value.trim(), slots: grid.getData() };
  const btn = $('#submit');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '送信しています…';
  try {
    if (mode === 'edit') {
      const r = await api('/api/r/' + encodeURIComponent(editToken), 'PUT', payload);
      finish(editToken, r.changed === 0 ? '変更はありませんでした。' : `修正を保存しました。${r.changed}か所の変更を主催者に伝えます。`);
    } else {
      const r = await api('/api/e/' + encodeURIComponent(pubToken) + '/responses', 'POST', payload);
      finish(r.edit_token, '提出しました。ありがとうございます。');
    }
  } catch (e) {
    err.textContent = e.message;
    scrollTo({ top: 0, behavior: 'smooth' });
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

function finish(tok, msg) {
  const url = `${location.origin}/vote.html?r=${tok}`;
  $('#editUrl').value = url;
  $('#reopen').href = url;
  $('#thanksMsg').textContent = msg;
  $('#main').hidden = true;
  $('#bar').hidden = true;
  $('#thanks').hidden = false;
  try { localStorage.setItem('nuriawase.edit.' + (pubToken || ''), tok); } catch {}
  scrollTo({ top: 0 });
}

$('#copyEdit').addEventListener('click', async (e) => {
  try {
    await navigator.clipboard.writeText($('#editUrl').value);
    e.target.textContent = 'コピーしました';
  } catch {
    $('#editUrl').select();
    e.target.textContent = '選択しました';
  }
  setTimeout(() => { e.target.textContent = 'コピー'; }, 1800);
});
</script>
</body>
</html>
